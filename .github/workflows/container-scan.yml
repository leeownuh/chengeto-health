name: Container Scan

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/container-scan.yml"
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/container-scan.yml"
  workflow_dispatch:

concurrency:
  group: container-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    name: Trivy (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: backend/Dockerfile
            context: ./backend
          - image: frontend
            dockerfile: frontend/Dockerfile
            context: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          platforms: linux/amd64
          provenance: false
          tags: chengeto-${{ matrix.image }}:scan
          build-args: |
            VITE_API_URL=http://example.com/api/v1
            VITE_SOCKET_URL=http://example.com
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: chengeto-${{ matrix.image }}:scan
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
      - name: Fail on high or critical vulnerabilities
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: chengeto-${{ matrix.image }}:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Generate image SBOM
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: chengeto-${{ matrix.image }}:scan
          format: cyclonedx
          output: ${{ matrix.image }}-image-sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.image }}-image-sbom
          path: ${{ matrix.image }}-image-sbom.json
          retention-days: 30
          if-no-files-found: error
