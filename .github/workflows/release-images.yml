name: Release Images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version, for example v1.2.3
        required: true
        type: string

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io

jobs:
  backend-image:
    name: Publish backend image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute release version
        id: meta
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.release_version }}" ]; then
            VERSION="${{ github.event.inputs.release_version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Compute registry owner
        id: owner
        shell: bash
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/chengeto-backend
          tags: |
            type=raw,value=${{ steps.meta.outputs.version }}
            type=raw,value=sha-${{ github.sha }}
      - name: Build and push backend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign backend image
        env:
          COSIGN_EXPERIMENTAL: "true"
        shell: bash
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/chengeto-backend@${{ steps.build.outputs.digest }}
      - name: Attest backend image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/chengeto-backend
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  frontend-image:
    name: Publish frontend image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute release version
        id: meta
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.release_version }}" ]; then
            VERSION="${{ github.event.inputs.release_version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Compute registry owner
        id: owner
        shell: bash
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/chengeto-frontend
          tags: |
            type=raw,value=${{ steps.meta.outputs.version }}
            type=raw,value=sha-${{ github.sha }}
      - name: Build and push frontend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'https://api.chengeto.health/api/v1' }}
            VITE_SOCKET_URL=${{ vars.VITE_SOCKET_URL || 'https://api.chengeto.health' }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign frontend image
        env:
          COSIGN_EXPERIMENTAL: "true"
        shell: bash
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/chengeto-frontend@${{ steps.build.outputs.digest }}
      - name: Attest frontend image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/chengeto-frontend
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  github-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - backend-image
      - frontend-image
    steps:
      - uses: actions/checkout@v4
      - name: Compute release version
        id: meta
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.release_version }}" ]; then
            VERSION="${{ github.event.inputs.release_version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Compute registry owner
        id: owner
        shell: bash
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Write release evidence
        shell: bash
        run: |
          cat <<EOF > release-evidence.md
          Version: ${{ steps.meta.outputs.version }}

          Backend image:
          - ghcr.io/${{ steps.owner.outputs.value }}/chengeto-backend@${{ needs.backend-image.outputs.digest }}

          Frontend image:
          - ghcr.io/${{ steps.owner.outputs.value }}/chengeto-frontend@${{ needs.frontend-image.outputs.digest }}

          Commit:
          - ${{ github.sha }}
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: release-evidence.md
