global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ['alertname', 'job', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
    webhook_configs:
      # Default local receiver for operator drills.
      # Mount a custom config through ALERTMANAGER_CONFIG_PATH when routing to a real external webhook.
      - url: http://host.docker.internal:19093/alerts
        send_resolved: true
