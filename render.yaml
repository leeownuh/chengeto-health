services:
  - type: web
    name: chengeto-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: MQTT_DEMO_AUTH
        value: "false"
      - key: ALERTMANAGER_DEFAULT_WEBHOOK_URL
        sync: false
  - type: web
    name: chengeto-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: starter
    healthCheckPath: /
    envVars:
      - key: VITE_API_URL
        value: https://api.chengeto.health/api/v1
      - key: VITE_SOCKET_URL
        value: https://api.chengeto.health
